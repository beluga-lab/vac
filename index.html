<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Climate Dashboard</title>
    <style>
        body { 
            font-family: 'Segoe UI', system-ui, sans-serif; 
            background-color: #f8f9fa; 
            margin: 0; 
            padding: 0; 
            color: #444;
            display: flex;
            justify-content: center;
        }

        /* --- 20px 极限薄顶栏 --- */
        header { 
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 20px; /* 强制 20px */
            background: #2c3e50; /* 深色背景更显精致 */
            color: #ecf0f1;
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 11px; /* 微型字体 */
        }

        .header-content {
            width: 100%;
            max-width: 850px;
            padding: 0 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 { 
            margin: 0; 
            font-size: 11px; 
            font-weight: 400; 
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .controls {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        /* 极简刷新文字链接 */
        .btn-refresh {
            background: none;
            border: none;
            color: #3498db;
            cursor: pointer;
            font-size: 11px;
            padding: 0;
            text-decoration: underline;
            font-weight: bold;
        }

        .btn-refresh:hover { color: #5dade2; }

        /* --- 主内容区偏移 --- */
        .container { 
            width: 100%;
            max-width: 850px; 
            padding: 35px 15px 30px 15px; /* 顶部预留 35px 间距 */
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .card { 
            background: #fff; 
            border: 1px solid #eee;
            border-radius: 4px;
            padding: 10px;
            margin-bottom: 20px;
            width: 100%; 
            box-sizing: border-box;
        }

        h3 { 
            margin: 0 0 8px 0; 
            font-size: 10px; 
            color: #999;
            text-transform: uppercase;
        }
        
        iframe { 
            width: 100%; 
            height: 480px; 
            border: none; 
        }

        @media (max-width: 600px) {
            iframe { height: 380px; }
            .update-tag { display: none; }
        }

        footer { font-size: 10px; color: #ccc; margin-top: 10px; }
    </style>
</head>
<body>

<header>
    <div class="header-content">
        <h1>Climate Monitoring</h1>
        <div class="controls">
            <span class="update-tag" id="last-update">Syncing...</span>
            <button class="btn-refresh" onclick="refreshAll()">SYNC</button>
        </div>
    </div>
</header>

<div class="container">
    <div class="card">
        <h3>Live Feed</h3>
        <iframe class="ts-frame" src="https://thingspeak.mathworks.com/apps/matlab_visualizations/654026"></iframe>
    </div>

    <div class="card">
        <h3>Trend Analysis</h3>
        <iframe class="ts-frame" src="https://thingspeak.mathworks.com/apps/matlab_visualizations/654028"></iframe>
    </div>

    <footer>
        <p>Location: France | Auto-Refresh: 5M</p>
    </footer>
</div>

<script>
    function refreshAll() {
        const frames = document.getElementsByClassName('ts-frame');
        for (let i = 0; i < frames.length; i++) {
            const currentSrc = frames[i].src;
            frames[i].src = '';
            frames[i].src = currentSrc;
        }
        updateTimestamp();
    }

    function updateTimestamp() {
        const now = new Date();
        const timeStr = now.getHours().toString().padStart(2, '0') + ':' + 
                        now.getMinutes().toString().padStart(2, '0');
        document.getElementById('last-update').innerText = 'Last: ' + timeStr;
    }

    updateTimestamp();
    setInterval(refreshAll, 300000);
</script>

</body>
</html>
