<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESP32 Temperature & Humidity Chart</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: Arial, sans-serif; 
      text-align: center; 
      padding: 20px; 
      background-color: #f8f9fa;
    }
    .chart-container {
      width: 100%;
      max-width: 1200px;
      height: 80vh;
      margin: 20px auto;
    }
    .control-panel { margin: 20px 0; }
    button {
      padding: 10px 20px;
      margin: 0 10px;
      border: none;
      border-radius: 5px;
      background: #0088cc;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover { background: #006699; }
    button.active { background: #004466; }
    h2 {
      color: #333;
      margin-bottom: 10px;
      font-size: 2rem;
    }
    .data-count { color: #666; font-size: 1.2rem; margin-bottom: 15px; }
    /* 新增：数据信息栏样式 */
    .status-info {
      font-size: 16px; /* 常规字体大小 */
      color: #333;
      margin: 15px 0;
      padding: 10px;
      background-color: #e9ecef;
      border-radius: 5px;
      display: inline-block;
      min-width: 400px;
      text-align: left;
    }
  </style>
</head>
<body>
  <h2>ESP32 Real-Time Temperature & Humidity</h2>
  <!-- 新增：状态信息显示区域 -->
  <div class="status-info" id="statusInfo">
    Last update: --/--/-- --:--:-- | Temperature: -- °C | Humidity: -- %
  </div>
  <div class="data-count">Current Data Points: <span id="pointCount">0</span> (View: <span id="viewMode">Last 30 Points</span>)</div>
  <div class="control-panel">
    <button onclick="showLast30Points()" class="active">Last 30 Points</button>
    <button onclick="changePoints(3000)">3000 Points</button>
    <button onclick="changePoints(6000)">6000 Points</button>
    <button onclick="changePoints(10000)">10000 Points</button>
  </div>
  <div class="chart-container">
    <canvas id="sensorChart"></canvas>
  </div>

  <script>
    const channelID = 3231598;
    const readAPIKey = "NG5C6S8JXNCBYN0S";
    let maxPoints = 6000;
    let viewMode = "last30";
    const fetchInterval = 30000;
    const DEFAULT_POINTS = 30;

    // 初始化图表
    const ctx = document.getElementById('sensorChart').getContext('2d');
    const sensorChart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: [],
        datasets: [
          {
            label: 'Temperature (°C)',
            data: [],
            borderColor: '#ff5733',
            backgroundColor: 'rgba(255,87,51,0.1)',
            borderWidth: 2,
            fill: true,
            tension: 0.1,
            pointRadius: 3,
            pointHoverRadius: 5,
            pointBackgroundColor: '#ff5733'
          },
          {
            label: 'Humidity (%)',
            data: [],
            borderColor: '#3375ff',
            backgroundColor: 'rgba(51,117,255,0.1)',
            borderWidth: 2,
            fill: true,
            tension: 0.1,
            pointRadius: 3,
            pointHoverRadius: 5,
            pointBackgroundColor: '#3375ff'
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        animation: { duration: 0 },
        elements: { line: { tension: 0.1 } },
        scales: {
          y: { 
            beginAtZero: false, 
            title: { display: true, text: 'Value', font: { size: 16, weight: 'bold' } },
            ticks: { font: { size: 14 }, maxTicksLimit: 8 }
          },
          x: { 
            title: { display: true, text: `Time (Last ${DEFAULT_POINTS} Points)`, font: { size: 16, weight: 'bold' } },
            ticks: { font: { size: 12 }, maxTicksLimit: 12 },
            grid: { display: false }
          }
        },
        plugins: {
          legend: { labels: { font: { size: 16 } } },
          tooltip: { mode: 'index', intersect: false }
        },
        interaction: { mode: 'nearest', axis: 'x', intersect: false }
      }
    });

    // 更新按钮激活状态
    function updateButtonActiveState(activeBtnFunc) {
      const buttons = document.querySelectorAll('.control-panel button');
      buttons.forEach(btn => btn.classList.remove('active'));
      if(activeBtnFunc === 'last30') buttons[0].classList.add('active');
      else if(activeBtnFunc === '3000') buttons[1].classList.add('active');
      else if(activeBtnFunc === '6000') buttons[2].classList.add('active');
      else if(activeBtnFunc === '10000') buttons[3].classList.add('active');
    }

    // 显示最近30个点
    function showLast30Points() {
      viewMode = "last30";
      document.getElementById('viewMode').textContent = `Last ${DEFAULT_POINTS} Points`;
      sensorChart.options.scales.x.title.text = `Time (Last ${DEFAULT_POINTS} Points)`;
      updateButtonActiveState('last30');
      fetchData();
    }

    // 按自定义点数切换
    function changePoints(count) {
      viewMode = "custom";
      maxPoints = count;
      document.getElementById('viewMode').textContent = `Last ${count} Points`;
      sensorChart.options.scales.x.title.text = `Time (Last ${count} Points)`;
      updateButtonActiveState(count.toString());
      fetchData();
    }

    // 格式化时间戳为 年/月/日 时:分:秒 格式（英文显示）
    function formatUpdateTime(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      const hours = String(date.getHours()).padStart(2, '0');
      const minutes = String(date.getMinutes()).padStart(2, '0');
      const seconds = String(date.getSeconds()).padStart(2, '0');
      return `${year}/${month}/${day} ${hours}:${minutes}:${seconds}`;
    }

    // 更新状态信息栏
    function updateStatusInfo(updateTime, temp, humi) {
      const statusEl = document.getElementById('statusInfo');
      // 格式化数值，保留1位小数
      const formattedTemp = temp ? temp.toFixed(1) : '--';
      const formattedHumi = humi ? humi.toFixed(1) : '--';
      statusEl.textContent = `Last update: ${updateTime} | Temperature: ${formattedTemp} °C | Humidity: ${formattedHumi} %`;
    }

    // 格式化ThingSpeak时间戳
    function parseThingSpeakTime(timeStr) {
      return timeStr.split('T')[1].split('Z')[0].split('.')[0];
    }

    // 数据获取与筛选
    async function fetchData() {
      try {
        const fetchCount = 10000;
        const resp = await fetch(`https://api.thingspeak.com/channels/${channelID}/feeds.json?api_key=${readAPIKey}&results=${fetchCount}`);
        const data = await resp.json();
        
        if(!data.feeds || data.feeds.length === 0) {
          console.warn("No data available from ThingSpeak");
          // 无数据时更新状态信息
          const emptyTime = formatUpdateTime(new Date());
          updateStatusInfo(emptyTime, null, null);
          return;
        }

        let filteredFeeds = [...data.feeds];
        
        // 筛选逻辑
        if(viewMode === "last30") filteredFeeds = filteredFeeds.slice(-DEFAULT_POINTS);
        else filteredFeeds = filteredFeeds.slice(0, maxPoints);

        // 解析数据
        const allLabels = filteredFeeds.map(f => parseThingSpeakTime(f.created_at));
        const allTemps = filteredFeeds.map(f => parseFloat(f.field1) || 0);
        const allHumis = filteredFeeds.map(f => parseFloat(f.field2) || 0);

        // 更新图表
        sensorChart.data.labels = allLabels;
        sensorChart.data.datasets[0].data = allTemps;
        sensorChart.data.datasets[1].data = allHumis;
        sensorChart.update('none');

        // 更新数据计数
        document.getElementById('pointCount').textContent = allTemps.length;

        // 获取最新的一条数据（最后一条）
        const latestFeed = filteredFeeds[filteredFeeds.length - 1];
        const latestTemp = parseFloat(latestFeed.field1);
        const latestHumi = parseFloat(latestFeed.field2);
        // 获取当前更新时间（本地时间）
        const currentUpdateTime = formatUpdateTime(new Date());
        // 更新状态信息栏
        updateStatusInfo(currentUpdateTime, latestTemp, latestHumi);

      } catch (error) {
        console.error("Failed to fetch data:", error);
        // 出错时也更新状态信息
        const errorTime = formatUpdateTime(new Date());
        updateStatusInfo(errorTime, null, null);
      }
    }

    // 初始加载
    showLast30Points();
    setInterval(fetchData, fetchInterval);
  </script>
</body>
</html>
